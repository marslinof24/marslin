<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f7f5">
  <title>Mars Lin</title>
  <link rel="canonical" href="https://marslinof24.github.io/marslin/workspace.html">
  <script>
    (function () {
      // Portfolio was retired in v2.0.0. Profile sections moved to About; project sections to Workspace.
      var about = { "portfolio-profile": "", "profile-heading": "#profile-heading", "background": "#background", "experience": "#experience", "practice": "#practice" };
      var workspace = ["main", "perfect-solution", "solution-title", "demo-preview", "demo-teaser-title", "demo-captures-title", "portfolio-project", "case-goal", "case-role", "case-workflow", "case-result", "course-exercises", "coursework"];
      var id = "";
      try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
      var target = "workspace.html";
      if (Object.prototype.hasOwnProperty.call(about, id)) target = "about.html" + about[id];
      else if (workspace.indexOf(id) !== -1) target = "workspace.html#" + id;
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=workspace.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=2.0.0">

</body>
