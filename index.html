<html lang="en">
<head>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://marslinof24.github.io/marslin/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Welcome — Mars Lin">
  <meta property="og:description" content="Explore Mars Lin's projects, background, and learning notes.">

<body>
  <script>
    // Returning visitors (same tab session) skip the intro; runs before first paint.
    try { if (sessionStorage.getItem('intro-seen')) document.body.classList.add('skip-intro'); sessionStorage.setItem('intro-seen', '1'); } catch (e) {}
  </script>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="silver" x1="8" y1="12" x2="56" y2="54" gradientUnits="userSpaceOnUse"><stop stop-color="#b4b2ad"/><stop offset=".35" stop-color="#77746e"/><stop offset=".55" stop-color="#e2e1dd"/><stop offset=".8" stop-color="#6c6964"/><stop offset="1" stop-color="#a5a39d"/></linearGradient></defs></svg>
  <a class="welcome-skip" href="#destinations">Skip introduction</a>
  <main class="welcome" aria-label="Welcome to Mars Lin’s website">
    <section class="stage" aria-labelledby="welcome-title">
      <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Mars Lin — handwritten M">
        <path class="glow" d="M7 50C10 42 14 19 21 16C27 14 29 30 30 38C31 43 26 45 26.5 41C27 36 33 29 36 23C39 17 42 15 45 16C50 18 48 38 49 45C50 50 54 51 58 47" pathLength="1" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" style="filter:blur(3px)"/>
        <path class="path" d="M7 50C10 42 14 19 21 16C27 14 29 30 30 38C31 43 26 45 26.5 41C27 36 33 29 36 23C39 17 42 15 45 16C50 18 48 38 49 45C50 50 54 51 58 47" pathLength="1"/>
      </svg>
      <p class="kicker">HI</p>
      <h1 id="welcome-title">I am Mars</h1>
      <p class="intro">Welcome! Nice to meet you.</p>
      <nav class="dest rows" id="destinations" aria-label="Choose a page" tabindex="-1">
        <a href="home.html" data-n="01">Home</a>
        <a href="workspace.html" data-n="02">Workspace <span class="aside">Work &amp; notes</span></a>
        <a href="about.html" data-n="03">About</a>
        <a class="contact" href="about.html#links" data-n="04">Contact me</a>
      </nav>
    </section>
    <p class="welcome-foot">©2026 MARS LIN</p>
  </main>
  <script>
    // Any key, click or the skip link ends the intro at once; links stay normal links.
    const finish = () => document.body.classList.add('skip-intro');
    addEventListener('keydown', finish, { once: true });
    addEventListener('pointerdown', finish, { once: true });
    document.querySelector('.welcome-skip').addEventListener('click', finish);
  </script>
</body>
</html>
